name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a build-machine Python matching the app's Python version.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Gateway smoke test
        run: GATEWAY_LITE=1 python gateway.py --db /tmp/ci.db simulate --n 60 > /dev/null

      - name: Build APK
        working-directory: android
        env:
          MCUBED_VERSION_CODE: ${{ github.run_number }}
          MCUBED_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MCUBED-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MCUBED-apk
          path: MCUBED-*.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MCUBED-*.apk
