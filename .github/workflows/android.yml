name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a build-machine Python matching the app's Python version.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Gateway smoke test
        run: GATEWAY_LITE=1 python gateway.py --db /tmp/ci.db simulate --n 60 > /dev/null

      - name: Build info and signing key
        env:
          KS_B64: ${{ secrets.MCUBED_KEYSTORE_B64 }}
        run: |
          printf '{"commit": "%s", "built_at": "%s", "run": %s, "ref": "%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_NUMBER" "$GITHUB_REF_NAME" > build_info.json
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mcubed.p12"; echo "MCUBED_KEYSTORE_FILE=$RUNNER_TEMP/mcubed.p12" >> "$GITHUB_ENV"; fi

      - name: Build APK
        working-directory: android
        env:
          MCUBED_KEYSTORE_PASSWORD: ${{ secrets.MCUBED_KEYSTORE_PASSWORD }}
          MCUBED_KEY_ALIAS: ${{ secrets.MCUBED_KEY_ALIAS }}
          MCUBED_VERSION_CODE: ${{ github.run_number }}
          MCUBED_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MCUBED-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MCUBED-apk
          path: MCUBED-*.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MCUBED-*.apk

      - name: Publish rolling "latest" build (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          gh release create latest MCUBED-*.apk -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (${GITHUB_SHA::7})" --notes "Newest MCUBED from main, built automatically. The in-app Update tab installs this."
